<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onesist</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #e0e0e0;
  }
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    text-align: center;
  }
  .logo-wrap {
    width: 72px;
    height: 72px;
    border-radius: 20px;
    background: #fff;
    border: 1px solid rgba(255,255,255,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: logoIn 700ms cubic-bezier(0.16, 1, 0.3, 1) both, logoPulse 2.2s ease-in-out 800ms infinite;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.06) inset;
    overflow: hidden;
    padding: 6px;
  }
  .logo-wrap img { width: 100%; height: 100%; object-fit: contain; }
  .logo-wrap svg { width: 36px; height: 36px; }
  .title {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.22em;
    color: #ffffff;
    animation: fadeUp 500ms cubic-bezier(0.16, 1, 0.3, 1) 200ms both;
  }
  .subtitle {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    color: #888;
    font-family: 'Geist Mono', monospace;
    animation: fadeUp 500ms cubic-bezier(0.16, 1, 0.3, 1) 350ms both;
  }
  .subtitle a { color: #888; text-decoration: none; }
  .loader {
    margin-top: 8px;
    display: flex;
    gap: 6px;
    align-items: center;
    animation: fadeIn 400ms ease 600ms both;
  }
  .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #4ade80;
    animation: bounce 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.15s; background: #22c55e; }
  .dot:nth-child(3) { animation-delay: 0.3s; background: #16a34a; }
  .progress {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: rgba(255,255,255,0.06);
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    width: 30%;
    background: linear-gradient(90deg, #4ade80, #22c55e);
    animation: progress 1.4s ease-in-out infinite;
  }
  @keyframes logoIn {
    from { opacity: 0; transform: scale(0.88) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes logoPulse {
    0%, 100% { box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.04) inset; }
    50% { box-shadow: 0 12px 40px rgba(74,222,128,0.15), 0 0 0 1px rgba(74,222,128,0.2) inset; }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(1); opacity: 0.7; }
    40% { transform: scale(1.3); opacity: 1; }
  }
  @keyframes progress {
    0% { transform: translateX(-100%); }
    50% { transform: translateX(250%); }
    100% { transform: translateX(-100%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .logo-wrap, .title, .subtitle, .loader, .dot, .progress-bar { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="logo-wrap">
      <img src="logo-icon.png" alt="Onesist" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
      <div class="logo-fallback" style="display:none">OS</div>
    </div>
    <div class="title">ONESIST</div>
    <div class="subtitle">by <a href="https://rogasper.com" target="_blank">rogasper.com</a></div>
    <div class="loader"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  </div>
  <div class="progress"><div class="progress-bar"></div></div>
</body>
</html>
