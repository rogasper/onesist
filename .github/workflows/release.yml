name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 (Apple Silicon)
          - platform: macos-14
            platform_key: darwin-aarch64
            target_triple: aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          # macOS x86_64 (Intel) — macos-13 runner deprecated; cross-compile
          # on arm64 macos-14 via rust target + bun --target.
          - platform: macos-14
            platform_key: darwin-x86_64
            target_triple: x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          # Windows x86_64 (NSIS installer is the updater target)
          - platform: windows-latest
            platform_key: windows-x86_64
            target_triple: x86_64-pc-windows-msvc
            rust_target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      # Export only the code-signing env vars that are actually configured.
      # Tauri CLI reads APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY / etc. as
      # "configured" when the variable is SET — even to an empty string — and
      # then tries to import/use the cert (fails with "failed to import
      # keychain certificate"). So empty secrets must be left UNSET, not ''.
      # NOTE: use if/then/fi, NOT `[ -n "$X" ] && echo ...` — when X is empty
      # the && short-circuits and the script exits 1, failing the step.
      - name: Export configured signing env
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then echo "TAURI_SIGNING_PRIVATE_KEY=$TAURI_SIGNING_PRIVATE_KEY" >> "$GITHUB_ENV"; fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" >> "$GITHUB_ENV"; fi
          if [ -n "$APPLE_CERTIFICATE" ]; then echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE" >> "$GITHUB_ENV"; fi
          if [ -n "$APPLE_CERTIFICATE_PASSWORD" ]; then echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"; fi
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"; fi
          if [ -n "$APPLE_ID" ]; then echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"; fi
          if [ -n "$APPLE_PASSWORD" ]; then echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"; fi
          if [ -n "$APPLE_TEAM_ID" ]; then echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"; fi
          if [ -n "$TAURI_WINDOWS_CERTIFICATE" ]; then echo "TAURI_WINDOWS_CERTIFICATE=$TAURI_WINDOWS_CERTIFICATE" >> "$GITHUB_ENV"; fi
          if [ -n "$TAURI_WINDOWS_CERTIFICATE_PASSWORD" ]; then echo "TAURI_WINDOWS_CERTIFICATE_PASSWORD=$TAURI_WINDOWS_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"; fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_WINDOWS_CERTIFICATE: ${{ secrets.TAURI_WINDOWS_CERTIFICATE }}
          TAURI_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.TAURI_WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Import Apple Developer certificate (macOS)
        if: startsWith(matrix.platform, 'macos') && env.APPLE_CERTIFICATE != ''
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          KEYCHAIN=build.keychain
          security create-keychain -p buildpass "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p buildpass "$KEYCHAIN"
          security import certificate.p12 -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k buildpass "$KEYCHAIN"
          rm -f certificate.p12

      - name: Install dependencies
        # --ignore-scripts: better-sqlite3/node-pty native builds crash under
        # node-gyp 13 + Node 20 in CI, but they're never loaded at runtime
        # (app uses bun:sqlite) and are excluded from the bundle — only the JS
        # sources are needed to compile the sidecar executable.
        run: bun install --ignore-scripts

      - name: Build server bundle + Tauri shell
        run: bunx tauri build ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cross-compile the compiled Bun sidecar for the target arch even
          # when the runner host arch differs (macos x86_64 on arm64 runner).
          SA_BUILD_TRIPLE: ${{ matrix.target_triple }}

      - name: Make updater artifact names unique per platform
        shell: bash
        # macOS updater artifact is just "Onesist.app.tar.gz" (no arch in the
        # name), so arm64 + x86_64 would collide in the GitHub Release. Prefix
        # every updater artifact + its .sig with the platform key.
        run: |
          for sig in $(find "src-tauri/target/${{ matrix.target_triple }}/release/bundle" -name '*.sig'); do
            art="${sig%.sig}"
            dir="$(dirname "$art")"
            name="$(basename "$art")"
            newname="${{ matrix.platform_key }}-${name}"
            mv "$art" "$dir/$newname"
            mv "$sig" "$dir/$newname.sig"
          done

      - name: Upload artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform_key }}
          path: src-tauri/target/${{ matrix.target_triple }}/release/bundle/
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Build update manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, glob, json, os, sys

          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          platforms = {}
          # Each platform directory contains its updater artifact + .sig:
          #   darwin-*: *.app.tar.gz   (the .dmg has no .sig)
          #   windows-*: *.exe         (NSIS, the updater target)
          for sig in glob.glob("artifacts/*/**/*.sig", recursive=True):
              artifact = sig[:-4]  # strip .sig
              name = os.path.basename(artifact)
              platform = os.path.relpath(artifact, "artifacts").split(os.sep)[0]  # dir name = platform_key
              with open(sig) as f:
                  sig_content = f.read().strip()
              platforms[platform] = {
                  "signature": sig_content,
                  "url": f"https://github.com/rogasper/onesist/releases/latest/download/{name}",
              }
              print(f"  {platform} <- {name}")

          if not platforms:
              print("!! no .sig artifacts found", file=sys.stderr)
              sys.exit(1)

          manifest = {
              "version": version,
              "notes": f"Onesist {version}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          with open("manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print("=== manifest.json ===")
          print(open("manifest.json").read())
          PY

      - name: Generate release notes
        shell: bash
        run: |
          # Use the curated CHANGELOG.md section for this version; fall back to
          # a commit list if the section is missing.
          VERSION="${{ github.ref_name }}"
          awk -v v="$VERSION" '
            $0 ~ "^## " v { insec=1; next }
            insec && /^## / { exit }
            insec { print }
          ' CHANGELOG.md > /tmp/release_notes.md
          if [ ! -s /tmp/release_notes.md ]; then
            PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p' || true)
            if [ -n "$PREV_TAG" ]; then RANGE="${PREV_TAG}..${GITHUB_SHA}"; else RANGE=""; fi
            if [ -n "$RANGE" ]; then git log --format='- %s' "$RANGE"; else git log --format='- %s'; fi | sed 's/^/- /' > /tmp/release_notes.md
          fi
          echo "=== release notes ==="
          cat /tmp/release_notes.md

      - name: Delete existing release for this tag
        shell: bash
        # Idempotent re-runs: softprops fails with "delete-a-release-asset Not
        # Found" when a (draft/partial) release already exists for the tag.
        # Remove it so the release is always created fresh.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Deleting existing release ${{ github.ref_name }}"
            gh release delete "${{ github.ref_name }}" --yes || true
          else
            echo "No existing release for ${{ github.ref_name }}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Onesist ${{ github.ref_name }}
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: false
          files: |
            manifest.json
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.sig
